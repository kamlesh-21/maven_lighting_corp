<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc"><title id="title">Exploded CAD concept for a bespoke suspended linear fixture</title><desc id="desc">Schematic with ceiling canopy, support frame, repeated rods, LED module and a lower detail of a replaceable rod connection.</desc><rect width="1200" height="480" rx="18" fill="#f7f6f2"/><text x="40" y="42" font-family="Arial,sans-serif" font-size="16" letter-spacing="3" fill="#66727d">CAD / ASSEMBLY LOGIC</text><text x="40" y="80" font-family="Georgia,serif" font-size="28" fill="#142b3f">Model interfaces, not just the silhouette</text><g stroke="#1d3548" stroke-width="3" fill="none"><path d="M340 125h520v30H340z" fill="#d9dfe2"/><path d="M365 155v24m470 -24v24" stroke-dasharray="5 5"/><path d="M320 190h560v24H320z" fill="#c5a66f"/><path d="M345 214v26m510 -26v26" stroke-dasharray="5 5"/><path d="M350 240v130m40 -130v105m40 -105v130m40 -130v90m40 -90v130m40 -130v110m40 -110v130m40 -130v90m40 -90v130m40 -130v115m40 -115v130m40 -130v95m40 -95v130m40 -130v110m40 -110v130" stroke="#7d929e" stroke-width="5"/><path d="M350 370h500" stroke="#c5a66f" stroke-width="8"/><path d="M610 125V95m-18 0h36" stroke="#1d3548" stroke-width="3"/></g><g font-family="Arial,sans-serif" fill="#17334a" font-size="14"><path d="M860 138h100v-25" stroke="#8799a4" fill="none"/><text x="970" y="110">Canopy / mounting plate</text><path d="M880 202h80v-15" stroke="#8799a4" fill="none"/><text x="970" y="180">Main frame / finish</text><path d="M850 290h110v-15" stroke="#8799a4" fill="none"/><text x="970" y="268">Repeated rods / glass</text><path d="M850 366h110v20" stroke="#8799a4" fill="none"/><text x="970" y="407">Bottom alignment datum</text></g><path d="M45 420h1110" stroke="#d5dadd"/><g transform="translate(50 435)" font-family="Arial,sans-serif" font-size="12" fill="#526875"><text x="0" y="0">Detail still required: rod retention, insert/thread, engagement, anti-rotation, service access and load 