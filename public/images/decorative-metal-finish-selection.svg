<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500"><rect width="1200" height="500" fill="#f7f5f0"/><text x="55" y="55" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#203246">SELECT THE FINISH SYSTEM, NOT JUST THE COLOUR</text><text x="55" y="88" font-family="Arial,sans-serif" font-size="17" fill="#536577">Use the same checklist for PVD, electroplating and lacquer.</text><g font-family="Arial,sans-serif" fill="#203246" stroke="#c4cbd0" stroke-width="2"><rect x="55" y="135" width="330" height="115" rx="12" fill="#fff"/><rect x="435" y="135" width="330" height="115" rx="12" fill="#fff"/><rect x="815" y="135" width="330" height="115" rx="12" fill="#fff"/><rect x="55" y="290" width="330" height="115" rx="12" fill="#fff"/><rect x="435" y="290" width="330" height="115" rx="12" fill="#fff"/><rect x="815" y="290" width="330" height="115" rx="12" fill="#fff"/></g><g font-family="Arial,sans-serif" fill="#203246"><text x="80" y="175" font-size="21" font-weight="700">01  Substrate</text><text x="80" y="210" font-size="17">Brass, stainless steel,</text><text x="80" y="233" font-size="17">aluminium or mild steel</text><text x="460" y="175" font-size="21" font-weight="700">02  Geometry</text><text x="460" y="210" font-size="17">Edges, recesses, joints</text><text x="460" y="233" font-size="17">and coating access</text><text x="840" y="175" font-size="21" font-weight="700">03  Environment</text><text x="840" y="210" font-size="17">Humidity, chemicals,</text><text x="840" y="233" font-size="17">handling and UV exposure</text><text x="80" y="330" font-size="21" font-weight="700">04  Appearance</text><text x="80" y="365" font-size="17">Physical sample, gloss,</text><text x="80" y="388" font-size="17">texture and colour tolerance</text><text x="460" y="330" font-size="21" font-weight="700">05  Performance</text><text x="460" y="365" font-size="17">Relevant tests and</text><text x="460" y="388" font-size="17">written acceptance criteria</text><text x="840" y="330" font-size="21" font-weight="700">06  Maintenance</text><text x="840" y="365" font-size="17">Cleaning, repair and</text><text x="840" y="388" font-size="17">replacement expectations</text></g><text x="55" y="455" font-family="Arial,sans-serif" font-size="18" fill="#6d4d2f">No finish is universally best. Performance depends on the complete substrate + preparation + coating system.</text></svg>