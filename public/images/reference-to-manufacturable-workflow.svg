<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc"><title id="title">From reference image to manufacturable lighting fixture</title><desc id="desc">Six stages: reference and assumptions, dimensions, CAD and assemblies, material and mass calculations, RCP and BIM coordination, BOM prototype and release.</desc><rect width="1200" height="440" rx="18" fill="#f6f4ef"/><text x="42" y="48" font-family="Arial,sans-serif" font-size="18" letter-spacing="3" fill="#66727d">MAVEN STUDIO / DESIGN-TO-MANUFACTURE</text><text x="42" y="90" font-family="Georgia,serif" font-size="30" fill="#142b3f">A photograph is the brief, not the specification.</text><g font-family="Arial,sans-serif" fill="#17334a"><g transform="translate(40 140)"><rect width="165" height="170" rx="10" fill="#fff" stroke="#b9c4cb"/><circle cx="82" cy="36" r="18" fill="#dfe8ed"/><text x="82" y="42" text-anchor="middle" font-size="17">01</text><text x="16" y="80" font-size="17" font-weight="700">Reference</text><text x="16" y="105" font-size="13">Image, brief,</text><text x="16" y="123" font-size="13">knowns / unknowns</text><text x="16" y="150" font-size="11" fill="#697a85">Evidence register</text></g><path d="M210 225h18m-6 -6 6 6 -6 6" fill="none" stroke="#82939e" stroke-width="2"/><g transform="translate(235 140)"><rect width="165" height="170" rx="10" fill="#fff" stroke="#b9c4cb"/><circle cx="82" cy="36" r="18" fill="#dfe8ed"/><text x="82" y="42" text-anchor="middle" font-size="17">02</text><text x="16" y="80" font-size="17" font-weight="700">Scale &amp; survey</text><text x="16" y="105" font-size="13">Confirmed size,</text><text x="16" y="123" font-size="13">views, clearances</text><text x="16" y="150" font-size="11" fill="#697a85">Dimensions / site</text></g><path d="M405 225h18m-6 -6 6 6 -6 6" fill="none" stroke="#82939e" stroke-width="2"/><g transform="translate(430 140)"><rect width="165" height="170" rx="10" fill="#fff" stroke="#b9c4cb"/><circle cx="82" cy="36" r="18" fill="#dfe8ed"/><text x="82" y="42" text-anchor="middle" font-size="17">03</text><text x="16" y="80" font-size="17" font-weight="700">CAD assembly</text><text x="16" y="105" font-size="13">Parametric parts,</text><text x="16" y="123" font-size="13">joints, tolerances</text><text x="16" y="150" font-size="11" fill="#697a85">Drawings / details</text></g><path d="M600 225h18m-6 -6 6 6 -6 6" fill="none" stroke="#82939e" stroke-width="2"/><g transform="translate(625 140)"><rect width="165" height="170" rx="10" fill="#fff" stroke="#b9c4cb"/><circle cx="82" cy="36" r="18" fill="#dfe8ed"/><text x="82" y="42" text-anchor="middle" font-size="17">04</text><text x="16" y="80" font-size="17" font-weight="700">Verify design</text><text x="16" y="105" font-size="13">Material, finish,</text><text x="16" y="123" font-size="13">mass, connections</text><text x="16" y="150" font-size="11" fill="#697a85">Samples / checks</text></g><path d="M795 225h18m-6 -6 6 6 -6 6" fill="none" stroke="#82939e" stroke-width="2"/><g transform="translate(820 140)"><rect width="165" height="170" rx="10" fill="#fff" stroke="#b9c4cb"/><circle cx="82" cy="36" r="18" fill="#dfe8ed"/><text x="82" y="42" text-anchor="middle" font-size="17">05</text><text x="16" y="80" font-size="17" font-weight="700">Coordinate</text><text x="16" y="105" font-size="13">RCP, BIM, ceiling,</text><text x="16" y="123" font-size="13">electrical / MEP</text><text x="16" y="150" font-size="11" fill="#697a85">Clash review</text></g><path d="M990 225h18m-6 -6 6 6 -6 6" fill="none" stroke="#82939e" stroke-width="2"/><g transform="translate(1015 140)"><rect width="145" height="170" rx="10" fill="#17334a"/><circle cx="72" cy="36" r="18" fill="#e7cfa4"/><text x="72" y="42" text-anchor="middle" font-size="17" fill="#17334a">06</text><text x="14" y="80" font-size="16" font-weight="700" fill="#fff">Release</text><text x="14" y="105" font-size="12" fill="#fff">BOM, prototype,</text><text x="14" y="123" font-size="12" fill="#fff">inspection, install</text><text x="14" y="150" font-size="10" fill="#d9e3e8">Controlled revision</text></g></g><text x="42" y="365" font-family="Arial,sans-serif" font-size="14" fill="#4c6170">Every critical value needs a source, a status and a reviewer.</text><text x="42" y="393" font-family="Arial,sans-serif" font-size="12" fill="#75848d">Original Maven Studio schematic • not a construction drawing</text></svg>