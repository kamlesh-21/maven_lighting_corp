<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460"><rect width="1200" height="460" fill="#f7f5f0"/><text x="60" y="58" font-family="Arial,sans-serif" font-size="27" fill="#203246" font-weight="700">CHANDLIER WEIGHT: FROM ESTIMATE TO SUPPORT COORDINATION</text><g font-family="Arial,sans-serif" fill="#203246" stroke="#9ca9b3" stroke-width="2"><rect x="55" y="120" width="235" height="210" rx="12" fill="#fff"/><rect x="335" y="120" width="235" height="210" rx="12" fill="#fff"/><rect x="615" y="120" width="235" height="210" rx="12" fill="#fff"/><rect x="895" y="120" width="250" height="210" rx="12" fill="#fff"/><path d="M290 225 H325 M570 225 H605 M850 225 H885" stroke="#9c6b3d" stroke-width="4"/><path d="M315 215 L325 225 L315 235 M595 215 L605 225 L595 235 M875 215 L885 225 L875 235" fill="none" stroke="#9c6b3d" stroke-width="4"/></g><g font-family="Arial,sans-serif" fill="#203246"><text x="78" y="158" font-size="18" font-weight="700">1. COMPONENT TAKE-OFF</text><text x="78" y="194" font-size="16">Frame, rods, glass,</text><text x="78" y="219" font-size="16">drivers, cables, fixings</text><text x="358" y="158" font-size="18" font-weight="700">2. MASS SCHEDULE</text><text x="358" y="194" font-size="16">Quantity × unit mass</text><text x="358" y="219" font-size="16">Record assumptions</text><text x="638" y="158" font-size="18" font-weight="700">3. CONFIRM GEOMETRY</text><text x="638" y="194" font-size="16">Dimensions, centre</text><text x="638" y="219" font-size="16">of gravity, revisions</text><text x="918" y="158" font-size="18" font-weight="700">4. VERIFY LOAD PATH</text><text x="918" y="194" font-size="16">Suspension, anchors,</text><text x="918" y="219" font-size="16">building structure</text><text x="78" y="285" font-size="14" fill="#667786">DESIGN-STAGE INPUT</text><text x="358" y="285" font-size="14" fill="#667786">CALCULATED ESTIMATE</text><text x="638" y="285" font-size="14" fill="#667786">PRODUCTION DATA</text><text x="918" y="285" font-size="14" fill="#667786">QUALIFIED REVIEW</text></g><text x="60" y="395" font-family="Arial,sans-serif" font-size="17" fill="#6d4d2f">Important: estimated fixture mass is not the same as verified load capacity at each support.</text></svg>