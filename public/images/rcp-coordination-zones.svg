<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc"><title id="title">Reflected ceiling plan coordination schematic</title><desc id="desc">Plan view of a room with a central chandelier, room axis, duct zone, diffuser and sprinkler symbols, and a note to coordinate the fixture with structure and MEP.</desc><rect width="1200" height="480" rx="18" fill="#f7f6f2"/><text x="40" y="42" font-family="Arial,sans-serif" font-size="16" letter-spacing="3" fill="#66727d">RCP / SITE COORDINATION</text><text x="40" y="80" font-family="Georgia,serif" font-size="28" fill="#142b3f">A visually centred fixture still needs a coordinated support</text><g transform="translate(75 115)"><rect x="0" y="0" width="660" height="300" fill="#fff" stroke="#526875" stroke-width="4"/><path d="M330 0v300M0 150h660" stroke="#9daab2" stroke-width="1.5" stroke-dasharray="8 7"/><circle cx="330" cy="150" r="74" fill="#f1e7d5" stroke="#b18b51" stroke-width="3"/><circle cx="330" cy="150" r="48" fill="none" stroke="#b18b51" stroke-dasharray="4 5" stroke-width="2"/><g fill="#b18b51"><circle cx="330" cy="100" r="5"/><circle cx="365" cy="115" r="5"/><circle cx="380" cy="150" r="5"/><circle cx="365" cy="185" r="5"/><circle cx="330" cy="200" r="5"/><circle cx="295" cy="185" r="5"/><circle cx="280" cy="150" r="5"/><circle cx="295" cy="115" r="5"/></g><rect x="15" y="15" width="200" height="40" fill="#dce7ec" stroke="#78909d"/><text x="25" y="40" font-family="Arial,sans-serif" font-size="13" fill="#17334a">Duct / service zone</text><rect x="445" y="18" width="195" height="40" fill="#e8e9e5" stroke="#9daab2"/><text x="455" y="43" font-family="Arial,sans-serif" font-size="13" fill="#17334a">Access panel</text><circle cx="590" cy="250" r="15" fill="#fff" stroke="#557d95" stroke-width="3"/><path d="M580 250h20m-10 -10v20" stroke="#557d95" stroke-width="2"/><text x="480" y="285" font-family="Arial,sans-serif" font-size="13" fill="#17334a">Sprinkler / detector zone</text><path d="M330 75v-30h115" stroke="#b18b51" stroke-width="2" fill="none"/><text x="450" y="49" font-family="Arial,sans-serif" font-size="13" fill="#17334a">Fixture centre / tag</text></g><g font-family="Arial,sans-serif" fill="#17334a"><text x="790" y="150" font-size="18" font-weight="700">Coordinate before release</text><text x="790" y="185" font-size="15">• Structural support above canopy</text><text x="790" y="215" font-size="15">• Finished ceiling and floor levels</text><text x="790" y="245" font-size="15">• HVAC, sprinklers and access panels</text><text x="790" y="275" font-size="15">• Driver access and cable route</text><text x="790" y="305" font-size="15">• Drop, head clearance and alignment</text><text x="790" y="360" font-size="12" fill="#75848d">Schematic only; not to scale and not a code-compliant project RCP.</text></g></svg>