<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520"><rect width="1200" height="520" fill="#fff"/><text x="55" y="52" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#203246">ROD LAYOUT: DEFINE PITCH AND END MARGINS</text><rect x="100" y="120" width="730" height="250" fill="#f7f5f0" stroke="#203246" stroke-width="3"/><g stroke="#9c6b3d" stroke-width="4"><line x1="130" y1="145" x2="130" y2="345"/><line x1="163" y1="145" x2="163" y2="345"/><line x1="196" y1="145" x2="196" y2="345"/><line x1="229" y1="145" x2="229" y2="345"/><line x1="262" y1="145" x2="262" y2="345"/><line x1="295" y1="145" x2="295" y2="345"/><line x1="328" y1="145" x2="328" y2="345"/><line x1="361" y1="145" x2="361" y2="345"/><line x1="394" y1="145" x2="394" y2="345"/><line x1="427" y1="145" x2="427" y2="345"/><line x1="460" y1="145" x2="460" y2="345"/><line x1="493" y1="145" x2="493" y2="345"/><line x1="526" y1="145" x2="526" y2="345"/><line x1="559" y1="145" x2="559" y2="345"/><line x1="592" y1="145" x2="592" y2="345"/><line x1="625" y1="145" x2="625" y2="345"/><line x1="658" y1="145" x2="658" y2="345"/><line x1="691" y1="145" x2="691" y2="345"/><line x1="724" y1="145" x2="724" y2="345"/><line x1="757" y1="145" x2="757" y2="345"/><line x1="790" y1="145" x2="790" y2="345"/></g><g stroke="#203246" stroke-width="2" fill="none"><path d="M100 90 V105 M830 90 V105 M100 98 H830"/><path d="M130 390 V415 M163 390 V415 M130 403 H163"/><path d="M100 380 V395 M130 380 V395 M100 387 H130"/></g><g font-family="Arial,sans-serif" fill="#203246"><text x="430" y="82" font-size="19" text-anchor="middle">Overall usable span L</text><text x="146" y="440" font-size="17">Pitch s (centre-to-centre)</text><text x="100" y="470" font-size="16">End margin</text><text x="900" y="145" font-size="22" font-weight="700">Before counting rods</text><text x="900" y="190" font-size="17">1. Define usable span.</text><text x="900" y="225" font-size="17">2. Set target pitch.</text><text x="900" y="260" font-size="17">3. Confirm end margins.</text><text x="900" y="295" font-size="17">4. Count positions, not just gaps.</text><text x="900" y="350" font-size="16" fill="#6d4d2f">For rectangular frames,</text><text x="900" y="375" font-size="16" fill="#6d4d2f">count each side and</text><text x="900" y="400" font-size="16" fill="#6d4d2f">avoid double-counting corners.</text></g></svg>